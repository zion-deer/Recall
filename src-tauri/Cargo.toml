[package]
name = "recall"
version = "0.1.13"
description = "Recall — a private, local-first memory for your computer"
authors = ["Recall"]
license = "LicenseRef-Proprietary"
publish = false
edition = "2021"
rust-version = "1.80"

[lib]
name = "recall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
active-win-pos-rs = "0.9"
url = "2"
xcap = "0.9.8"
image = { version = "0.25.6", default-features = false, features = ["jpeg"] }
sha2 = "0.10.9"
reqwest = { version = "0.13.3", default-features = false, features = ["stream", "rustls"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
tauri-plugin-updater = "2"
llama-cpp-2 = { version = "0.1.158", default-features = false, features = ["common"] }
futures-util = "0.3"
tokio = { version = "1.53.2", features = ["fs", "io-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
