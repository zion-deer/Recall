name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify-signing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Write updater private key for verification
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY repository secret is not set."
            exit 1
          fi
          install -m 600 /dev/null "$RUNNER_TEMP/recall-updater.key"
          printf '%s\n' "$TAURI_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/recall-updater.key"
          echo "TAURI_SIGNING_PRIVATE_KEY_PATH=$RUNNER_TEMP/recall-updater.key" >> "$GITHUB_ENV"
      - name: Verify updater signing password
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/verify-tauri-signing.mjs

  build:
    needs: verify-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Prepare updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/recall-updater.key"
          printf '%s\n' "$TAURI_SIGNING_PRIVATE_KEY" > "$RUNNER_TEMP/recall-updater.key"
          PASS=$(python3 -c "import os; print(os.environ.get('TAURI_SIGNING_PRIVATE_KEY_PASSWORD','').rstrip('\\r\\n '))")
          {
            echo "TAURI_SIGNING_PRIVATE_KEY_PATH=$RUNNER_TEMP/recall-updater.key"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$PASS"
          } >> "$GITHUB_ENV"

      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [IO.File]::WriteAllBytes("cert.pfx", $bytes)
          Import-PfxCertificate -FilePath cert.pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)
          Remove-Item cert.pfx

      - name: Enable Apple signing only when explicitly turned on
        if: runner.os == 'macOS' && vars.ENABLE_APPLE_SIGNING == 'true'
        run: |
          {
            echo "APPLE_CERTIFICATE<<EOF"
            echo "${{ secrets.APPLE_CERTIFICATE }}"
            echo "EOF"
            echo "APPLE_CERTIFICATE_PASSWORD<<EOF"
            echo "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "EOF"
            echo "APPLE_SIGNING_IDENTITY<<EOF"
            echo "${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "EOF"
            echo "APPLE_ID<<EOF"
            echo "${{ secrets.APPLE_ID }}"
            echo "EOF"
            echo "APPLE_PASSWORD<<EOF"
            echo "${{ secrets.APPLE_PASSWORD }}"
            echo "EOF"
            echo "APPLE_TEAM_ID<<EOF"
            echo "${{ secrets.APPLE_TEAM_ID }}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PATH }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Recall ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md for details."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
