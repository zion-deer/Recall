name: CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx vite build

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev g++ libclang-dev libpipewire-0.3-dev libgbm-dev libxcb-randr0-dev
      - name: C++ headers for the local AI runtime
        if: runner.os == 'Linux'
        run: |
          version="$(g++ -dumpversion)"
          echo "CPLUS_INCLUDE_PATH=/usr/include/c++/${version}:/usr/include/x86_64-linux-gnu/c++/${version}" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(dirname "$(g++ -print-file-name=libstdc++.so)")" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          package-manager-cache: false
      - run: npm ci
      # tauri::generate_context! embeds the built frontend.
      - run: npx vite build
      - working-directory: src-tauri
        run: cargo fmt --check
      - working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - working-directory: src-tauri
        run: cargo test

